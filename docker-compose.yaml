services:
  database:
    container_name: tenpo
    env_file:
      - .env
    image: postgres:17
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tenpo_network

  frontend:
    container_name: frontend
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - database
    networks:
      - tenpo_network

  backend:
    container_name: backend
    build:
      context: ./backend/
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - database
    networks:
      - tenpo_network

networks:
  tenpo_network:
    driver: bridge

volumes:
  postgres_data: