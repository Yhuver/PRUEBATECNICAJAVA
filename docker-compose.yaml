services:
  database:
    container_name: tenpo
    env_file:
      - path: ./.env
        required: true
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tenpo_network

  frontend:
    container_name: frontend
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    ports:
      - "5174:5173"
    depends_on:
      - database
    networks:
      - tenpo_network

  backend:
    container_name: backend
    build:
      context: ./backend/
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: true
    ports:
      - "8080:8080"
    depends_on:
      - database
    networks:
      - tenpo_network


networks:
  tenpo_network:
    driver:
      bridge


volumes:
  postgres_data: